# resources/SCETOP/adapters.yaml
adapters:
  - adapter_id: "SCETOP_01"
    adapter_name: "四川托普信息技术职业学院-正方教务"
    category: "BACHELOR_AND_ASSOCIATE"
    asset_js_path: "scetop_zf_legacy.js"
    import_url: "http://zf.scetop.com/default2.aspx"
    maintainer: "psenY"
    description: "四川托普信息技术职业学院教务系统课表导入。登录后在「信息查询」里打开「学生个人课表」或「班级课表查询」，显示出周课表即可导入。导入会同时读取两个课表页：学生个人课表优先，班级课表只用来补齐个人课表里没有的课程；开学初期个人课表还没排出来时，会按班级课表导入完整课表。上课时间按学校作息自动设置（A 教学区以外的第 3、4 节和周五下午会单独调整）。没有固定上课时间的实践、实训类课程不会导入，可以手动添加。"
